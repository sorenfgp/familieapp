name: Byg app

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Test og byg
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest assembleDebug --stacktrace 2>&1 | tee build.log
      - name: Vis fejl som annotationer
        if: failure()
        run: |
          grep -E "^e: |FAILED|AssertionError|expected:<|What went wrong" build.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done
          for f in app/build/test-results/testDebugUnitTest/*.xml; do
            grep -A2 "<failure" "$f" | head -6 | while IFS= read -r line; do echo "::error file=$f::$line"; done
          done || true
      - uses: actions/upload-artifact@v4
        with:
          name: familieapp-debug
          path: app/build/outputs/apk/debug/*.apk
